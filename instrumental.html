<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>NEURAL GALAXY - TWINKLING SPACE</title>
    <!-- Library Utama Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Framework UI Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #000; 
            font-family: 'JetBrains Mono', monospace; 
            width: 100vw; 
            height: 100dvh; 
            user-select: none;
            color: #ffaa00;
        }
        canvas { display: block; width: 100% !important; height: 100% !important; cursor: pointer; }
        
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100dvh;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: radial-gradient(circle at center, #0a0500 0%, #000 100%);
            color: white;
            z-index: 100;
            transition: opacity 0.4s ease-in-out;
        }

        .vignette {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100dvh;
            box-shadow: inset 0 0 350px rgba(0,0,0,1);
            pointer-events: none;
            z-index: 5;
        }

        .hud-area {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 60;
            padding-top: var(--safe-top);
            padding-bottom: var(--safe-bottom);
            transition: opacity 0.5s ease;
        }

        .hud-hidden { opacity: 0 !important; }

        /* TELEMETRY PANEL */
        .telemetry-panel {
            position: absolute;
            top: calc(15px + var(--safe-top));
            left: 15px;
            pointer-events: none;
            width: 160px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .data-card {
            background: rgba(10, 5, 0, 0.6);
            backdrop-filter: blur(15px);
            border-left: 1px solid #ff4400;
            padding: 10px;
            font-size: 8px;
            text-transform: uppercase;
        }

        .row { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .lbl { color: rgba(255, 255, 255, 0.2); letter-spacing: 0.5px; }
        .val { color: #ffaa00; font-weight: bold; }

        #coord-log {
            font-size: 5.5px;
            height: 40px;
            overflow: hidden;
            opacity: 0.4;
            margin-top: 6px;
            line-height: 1.3;
            color: #ff4400;
            border-top: 1px solid rgba(255, 68, 0, 0.05);
            padding-top: 6px;
        }

        /* NAVIGATION */
        .control-panel {
            position: absolute;
            bottom: calc(15px + var(--safe-bottom));
            right: 15px;
            background: rgba(255, 68, 0, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 68, 0, 0.15);
            border-radius: 40px;
            padding: 6px 12px;
            display: inline-flex;
            gap: 10px;
            pointer-events: auto;
        }

        .ctrl-btn {
            color: rgba(255, 170, 0, 0.4);
            font-size: 14px;
            cursor: pointer;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .ctrl-btn:hover { color: #fff; }
        .active-state { color: #ffaa00 !important; }

        #toggle-ui-btn {
            position: absolute;
            top: calc(15px + var(--safe-top));
            right: 15px;
            width: 35px;
            height: 35px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 68, 0, 0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            z-index: 70;
            color: rgba(255, 170, 0, 0.5);
        }

        #pause-indicator {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: #ff4400;
            font-size: 9px;
            letter-spacing: 1.2em;
            opacity: 0;
            pointer-events: none;
            z-index: 55;
            background: rgba(0,0,0,0.9);
            padding: 15px 30px;
            border-left: 2px solid #ff4400;
        }
    </style>
</head>
<body>
    <div id="toggle-ui-btn" onclick="toggleUI()">👁️</div>
    <div id="pause-indicator">LINK_OFFLINE</div>
    <div class="vignette"></div>
    
    <div id="hud" class="hud-area">
        <div class="telemetry-panel">
            <div class="data-card">
                <div class="row"><span class="lbl">STARS_SYNC</span> <span class="val">ACTIVE</span></div>
                <div class="row"><span class="lbl">ACTIVE_CORES</span> <span id="v-nodes" class="val">000</span></div>
                <div class="row"><span class="lbl">SIGNAL_INT</span> <span id="v-int" class="val">0.0%</span></div>
                <div class="row"><span class="lbl">LIVE_COORD</span> <span id="v-coords-main" class="val">0 0 0</span></div>
                <div id="coord-log">SPACE_LINK_ESTABLISHED...</div>
            </div>
            <div class="w-full h-[1.5px] bg-white/5 overflow-hidden rounded-full">
                <div id="mic-level-bar" class="h-full bg-orange-600 w-0"></div>
            </div>
        </div>

        <div class="control-panel">
            <div id="playPauseBtn" class="ctrl-btn active-state" onclick="togglePlayPause(event)">
                <span id="pp-icon">⏸</span>
            </div>
            <div id="fsBtn" class="ctrl-btn" onclick="toggleFullScreen(event)">
                <span>⛶</span>
            </div>
            <div id="resetBtn" class="ctrl-btn" onclick="resetVisuals(event)">
                <span>↺</span>
            </div>
        </div>
    </div>

    <div id="overlay">
        <div class="text-center px-6">
            <h1 class="text-5xl font-thin tracking-[1.5em] mb-4 text-white uppercase ml-[1.5em]">Cosmos</h1>
            <p class="text-[8px] tracking-[1em] text-orange-500 mb-16 uppercase">Stellar Twinkle Mapping System</p>
            <button id="startButton" class="px-16 py-6 border border-orange-500/30 rounded-full hover:bg-orange-600 hover:text-black transition-all">
                <span class="text-[10px] font-bold tracking-[1.2em]">IGNITE CORE</span>
            </button>
        </div>
    </div>

    <script>
        /**
         * LOGIK ENGINE - TWINKLING STARS & SLEEK TAILS
         */
        let scene, camera, renderer, analyser, dataArray;
        let isInitialized = false, isPaused = false, uiVisible = true;
        let starField, lastNodePos = new THREE.Vector3(0, 0, 0);
        let logEntries = [];
        let starMaterial; // Untuk shader kelap-kelip
        
        const nodePool = [];
        const linePool = [];
        const pulsePool = [];
        const activeNodes = [];
        const activeLines = [];
        const activePulses = [];
        const POOL_SIZE = 200; 

        const SCRATCH_V3 = new THREE.Vector3();
        const PALETTE = [0xffaa00, 0xff4400, 0xff2200, 0xffffff, 0x00ffcc];
        
        const NODE_GEO = new THREE.SphereGeometry(1, 32, 32); 
        const PULSE_GEO = new THREE.SphereGeometry(1, 16, 16);
        const LINE_GEO = new THREE.BufferGeometry();
        LINE_GEO.setAttribute('position', new THREE.Float32BufferAttribute([0,0,0, 0,0,0], 3));

        function toggleUI() {
            uiVisible = !uiVisible;
            document.getElementById('hud').classList.toggle('hud-hidden', !uiVisible);
        }

        function toggleFullScreen(e) {
            if (e) e.stopPropagation();
            const doc = document.documentElement;
            if (!document.fullscreenElement) {
                const reqFs = doc.requestFullscreen || doc.webkitRequestFullscreen || doc.mozRequestFullScreen || doc.msRequestFullscreen;
                if (reqFs) reqFs.call(doc).catch(() => toggleUI());
            } else {
                const exitFs = document.exitFullscreen || document.webkitExitFullscreen || document.mozCancelFullScreen || document.msExitFullscreen;
                if (exitFs) exitFs.call(document);
            }
        }

        function togglePlayPause(e) {
            if (e) e.stopPropagation();
            isPaused = !isPaused;
            document.getElementById('pp-icon').innerText = isPaused ? '▶' : '⏸';
            document.getElementById('pause-indicator').style.opacity = isPaused ? '1' : '0';
        }

        function resetVisuals(e) {
            if (e) e.stopPropagation();
            activeNodes.forEach(n => { n.mesh.visible = false; n.label.visible = false; n.active = false; });
            activeLines.forEach(l => { l.mesh.visible = false; l.active = false; });
            activeNodes.length = 0; activeLines.length = 0;
            lastNodePos.set(0, 0, 0);
            updateLog("STARK_SYSTEM_REBOOT...");
        }

        function updateLog(msg) {
            const el = document.getElementById('coord-log');
            logEntries.unshift(`> ${msg}`);
            if(logEntries.length > 3) logEntries.pop();
            el.innerHTML = logEntries.join('<br>');
        }

        function updateHUD(intensity, pos) {
            document.getElementById('v-nodes').innerText = activeNodes.length.toString().padStart(3, '0');
            document.getElementById('v-int').innerText = ((intensity/255)*100).toFixed(1) + "%";
            document.getElementById('v-coords-main').innerText = `${Math.round(pos.x/10)} ${Math.round(pos.y/10)} ${Math.round(pos.z/10)}`;
        }

        function updateLabel(sprite, x, y, z, colorHex) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 128; canvas.height = 48;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = colorHex;
            ctx.font = 'bold 22px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(`${Math.round(x/10)} ${Math.round(y/10)} ${Math.round(z/10)}`, 64, 30);
            if (sprite.material.map) sprite.material.map.dispose();
            sprite.material.map = new THREE.CanvasTexture(canvas);
            sprite.material.needsUpdate = true;
        }

        async function initAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256; 
                analyser.smoothingTimeConstant = 0.02;
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                isInitialized = true;
                document.getElementById('overlay').style.opacity = '0';
                setTimeout(() => document.getElementById('overlay').style.display = 'none', 400);
            } catch (err) { console.error(err); }
        }

        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(85, window.innerWidth / window.innerHeight, 1, 25000);
            
            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); 
            renderer.toneMapping = THREE.ReinhardToneMapping;
            renderer.toneMappingExposure = 4.2; 
            document.body.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambientLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(100, 200, 100);
            scene.add(dirLight);

            const camLight = new THREE.PointLight(0xffffff, 1.5, 1200);
            camera.add(camLight);
            scene.add(camera);

            // SHADER UNTUK BINTANG KELAP KELIP
            const vertexShader = `
                attribute float size;
                attribute float twinkleOffset;
                varying float vTwinkle;
                varying vec3 vColor;
                void main() {
                    vTwinkle = twinkleOffset;
                    vColor = color;
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = size * (300.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                }
            `;
            const fragmentShader = `
                uniform float uTime;
                varying float vTwinkle;
                varying vec3 vColor;
                void main() {
                    float twinkle = 0.6 + 0.4 * sin(uTime * 3.0 + vTwinkle);
                    gl_FragColor = vec4(vColor, twinkle);
                }
            `;

            const starCount = 15000;
            const starGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(starCount * 3);
            const colors = new Float32Array(starCount * 3);
            const sizes = new Float32Array(starCount);
            const twinkleOffsets = new Float32Array(starCount);
            
            const palette = [0xffffff, 0x9db2ff, 0xffd2a1, 0x666666];
            for(let i=0; i<starCount; i++) {
                positions[i*3] = (Math.random()-0.5)*15000;
                positions[i*3+1] = (Math.random()-0.5)*25000;
                positions[i*3+2] = (Math.random()-0.5)*15000;
                
                const c = new THREE.Color(palette[Math.floor(Math.random()*palette.length)]);
                colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
                
                sizes[i] = 1.0 + Math.random() * 2.5;
                twinkleOffsets[i] = Math.random() * 100.0;
            }
            
            starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            starGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            starGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            starGeo.setAttribute('twinkleOffset', new THREE.BufferAttribute(twinkleOffsets, 1));
            
            starMaterial = new THREE.ShaderMaterial({
                uniforms: { uTime: { value: 0.0 } },
                vertexShader,
                fragmentShader,
                transparent: true,
                vertexColors: true
            });
            
            starField = new THREE.Points(starGeo, starMaterial);
            scene.add(starField);

            const CONFIG = {
                threshold: 28, orbitSpeed: 0.08, baseRadius: 650, peakScale: 18.0, stableScale: 6.0, pulseSpeed: 0.4
            };

            for(let i=0; i<POOL_SIZE; i++) {
                const mat = new THREE.MeshStandardMaterial({ color: 0x222222, emissive: 0xffffff, emissiveIntensity: 3.0, metalness: 0.8, roughness: 0.2, transparent: true });
                const mesh = new THREE.Mesh(NODE_GEO, mat);
                mesh.visible = false; scene.add(mesh);
                const label = new THREE.Sprite(new THREE.SpriteMaterial({ transparent: true }));
                label.visible = false; label.scale.set(45, 17, 1); scene.add(label);
                nodePool.push({ mesh, mat, label, active: false, time: 0, finalColor: new THREE.Color() });

                const pMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true });
                const pulse = new THREE.Mesh(PULSE_GEO, pMat);
                pulse.visible = false; scene.add(pulse);
                pulsePool.push({ mesh: pulse, mat: pMat, active: false, start: new THREE.Vector3(), end: new THREE.Vector3(), progress: 0 });

                // Line: Kembalikan ke Ukuran Semula (Ramping)
                const lMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true });
                const lMesh = new THREE.Line(LINE_GEO.clone(), lMat);
                lMesh.visible = false; scene.add(lMesh);
                linePool.push({ mesh: lMesh, mat: lMat, active: false, time: 0, finalColor: new THREE.Color() });
            }

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            animate();
        }

        function createActualNode(pos, color) {
            const nodeObj = nodePool.find(n => !n.active) || nodePool[0];
            nodeObj.active = true; nodeObj.time = Date.now(); nodeObj.finalColor.set(color);
            nodeObj.mesh.position.copy(pos); nodeObj.mesh.visible = true;
            nodeObj.mesh.scale.setScalar(18.0); // Node baru lebih kecil & teknikal
            nodeObj.mat.emissive.set(0xffffff); nodeObj.mat.emissiveIntensity = 8.0; nodeObj.mat.opacity = 1.0;
            nodeObj.label.visible = true; nodeObj.label.position.set(pos.x + 35, pos.y + 15, pos.z);
            updateLabel(nodeObj.label, pos.x, pos.y, pos.z, `#${nodeObj.finalColor.getHexString()}`);
            activeNodes.push(nodeObj);
            updateLog(`CORE_LINK_${Math.round(pos.y)}`);
        }

        function spawnNode(intensity) {
            if (isPaused) return;
            const targetColor = PALETTE[Math.floor(Math.random() * PALETTE.length)];
            SCRATCH_V3.set((Math.random()-0.5) * 80, (Math.random()-0.5) * 260, (Math.random()-0.5) * 120);
            const newPos = lastNodePos.clone().add(SCRATCH_V3);
            if(newPos.length() > 500) newPos.lerp(new THREE.Vector3(0,0,0), 0.75);

            if (activeNodes.length > 0) {
                const lineObj = linePool.find(l => !l.active) || linePool[0];
                lineObj.active = true; lineObj.time = Date.now(); lineObj.finalColor.set(0xff4400); 
                lineObj.mesh.visible = true;
                lineObj.mat.color.set(0xffffff); // Kilatan api putih saat baru
                lineObj.mat.opacity = 1.0;
                const posAttr = lineObj.mesh.geometry.attributes.position;
                posAttr.setXYZ(0, lastNodePos.x, lastNodePos.y, lastNodePos.z);
                posAttr.setXYZ(1, newPos.x, newPos.y, newPos.z);
                posAttr.needsUpdate = true;
                activeLines.push(lineObj);

                const pObj = pulsePool.find(p => !p.active) || pulsePool[0];
                pObj.active = true; pObj.start.copy(lastNodePos); pObj.end.copy(newPos); pObj.progress = 0;
                pObj.mesh.visible = true; pObj.color = targetColor;
                activePulses.push(pObj);
            } else {
                createActualNode(newPos, targetColor);
            }
            lastNodePos.copy(newPos);
            updateHUD(intensity, newPos);
        }

        function animate() {
            requestAnimationFrame(animate);
            if (!isInitialized) return;
            const now = Date.now(), time = now * 0.001;

            // Update Twinkle Shader Time
            if(starMaterial) starMaterial.uniforms.uTime.value = time;

            if (!isPaused) {
                analyser.getByteFrequencyData(dataArray);
                let max = 0;
                for(let i=0; i<dataArray.length; i++) { if(dataArray[i] > max) max = dataArray[i]; }
                document.getElementById('mic-level-bar').style.width = Math.min(100, (max / 120) * 100) + "%";
                if (max > 28) spawnNode(max);
            }

            camera.position.x = Math.sin(time * 0.08) * (600 + Math.sin(time*0.4)*50);
            camera.position.z = Math.cos(time * 0.08) * (600 + Math.sin(time*0.4)*50);
            camera.position.y = Math.sin(time * 0.1) * 120;
            camera.lookAt(0,0,0);

            starField.rotation.y += 0.0003;

            for (let i = activePulses.length - 1; i >= 0; i--) {
                const p = activePulses[i]; p.progress += 0.4;
                p.mesh.position.lerpVectors(p.start, p.end, p.progress);
                p.mesh.scale.setScalar(12 + Math.sin(time * 50) * 6);
                if (p.progress >= 1.0) { createActualNode(p.end, p.color); p.mesh.visible = false; p.active = false; activePulses.splice(i, 1); }
            }

            for (let i = activeNodes.length - 1; i >= 0; i--) {
                const n = activeNodes[i]; const age = now - n.time;
                const ratio = 1.0 - (age / 4000);
                const isLatest = (i === activeNodes.length - 1);
                if (isLatest) { n.mat.emissive.set(0xffffff); n.mat.emissiveIntensity = 8.0; }
                else { 
                    n.mat.emissive.lerp(n.finalColor, 0.4); n.mat.emissiveIntensity = 3.5 * ratio; n.mat.opacity = ratio; n.label.material.opacity = ratio; 
                    n.mesh.scale.setScalar(6.0 * ratio); // Pengecilan instan
                }
                if (ratio <= 0) { n.mesh.visible = false; n.label.visible = false; n.active = false; activeNodes.splice(i, 1); }
            }

            for (let i = activeLines.length - 1; i >= 0; i--) {
                const l = activeLines[i]; const age = now - l.time;
                const ratio = 1.0 - (age / 3200);
                const isLatest = (i === activeLines.length - 1);
                if (isLatest) {
                    if (age < 150) { l.mat.color.set(0xffffff); } else { l.mat.color.lerp(new THREE.Color(0xff4400), 0.2); }
                    l.mat.opacity = 1.0;
                } else { l.mat.color.lerp(l.finalColor, 0.15); l.mat.opacity = ratio * 0.5; }
                if (ratio <= 0) { l.mesh.visible = false; l.active = false; activeLines.splice(i, 1); }
            }
            renderer.render(scene, camera);
        }

        document.getElementById('startButton').addEventListener('click', initAudio);
        window.onload = initThree;
    </script>
</body>
</html>
