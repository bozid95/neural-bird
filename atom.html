<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nature Acoustic - IG/TikTok satisfying Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #000; 
            font-family: 'Inter', sans-serif; 
            width: 100vw; 
            height: 100dvh; 
            position: fixed; /* Mencegah bounce scroll di iOS */
        }
        canvas { display: block; width: 100% !important; height: 100% !important; }
        
        #interface {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        /* Skala Sumbu kHz (Y) - Digeser agar tidak tertutup tombol UI TikTok */
        .axis-y {
            position: absolute;
            left: 20px; top: 15%; bottom: 30%;
            display: flex; flex-direction: column-reverse;
            justify-content: space-between;
            font-size: 10px; font-family: 'JetBrains Mono', monospace;
            border-left: 1px dashed rgba(255,255,255,0.2);
            padding-left: 10px;
            letter-spacing: 0.5px;
            color: rgba(255,255,255,0.5);
        }

        /* Skala Sumbu Spasial (X) - Ditinggikan agar tidak tertutup caption/username */
        .axis-x {
            position: absolute;
            left: 20%; right: 20%; bottom: 28%;
            display: flex;
            justify-content: space-between;
            font-size: 8px; font-family: 'JetBrains Mono', monospace;
            border-bottom: 1px dashed rgba(255,255,255,0.2);
            padding-bottom: 6px;
            letter-spacing: 1px;
            color: rgba(255,255,255,0.3);
        }

        /* Kontrol diletakkan di area tengah bawah agar mudah dijangkau sebelum recording */
        .safe-bottom-area { bottom: calc(12% + var(--safe-bottom)); }

        .control-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 12px 28px;
            display: flex; gap: 20px;
            pointer-events: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        
        .ctrl-btn {
            font-size: 10px; font-weight: 800; letter-spacing: 2px;
            transition: all 0.3s; cursor: pointer; color: #fff;
            opacity: 0.5;
        }
        .ctrl-btn:active { transform: scale(0.9); }
        .active-state { color: #22d3ee !important; opacity: 1; text-shadow: 0 0 10px #22d3ee; }

        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100dvh;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: radial-gradient(circle at center, #111 0%, #000 100%);
            color: white; z-index: 100; transition: opacity 1s ease-in-out;
        }

        .top-hud {
            position: absolute;
            top: calc(8% + var(--safe-top));
            width: 100%;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="interface">
        <div class="top-hud">
            <div class="text-cyan-400 font-light text-[18px] tracking-[0.8em] mb-1 uppercase drop-shadow-lg">Satisfying Nature</div>
            <div id="status-text" class="text-[7px] tracking-[0.6em] opacity-40 italic uppercase">3D_Neural_Acoustic_v2.2</div>
        </div>

        <div class="axis-y">
            <span>0.0</span><span>2.5</span><span>5.0</span><span>7.5</span><span>10.0</span>
        </div>

        <div class="axis-x">
            <span>COORD_L</span><span class="opacity-20 text-[6px]">SPATIAL_SYNC</span><span>COORD_R</span>
        </div>

        <div class="absolute safe-bottom-area left-1/2 -translate-x-1/2 flex flex-col items-center gap-6 w-full">
            <div id="node-count" class="text-[8px] font-mono opacity-20 tracking-widest uppercase">Atoms: 0 | Proc: Slow-Motion Orbit</div>
            <div class="control-panel">
                <div id="playPauseBtn" class="ctrl-btn active-state">PAUSE</div>
                <div id="resetBtn" class="ctrl-btn">RESET</div>
                <div id="fullScreenBtn" class="ctrl-btn">FULL</div>
            </div>
            <div class="text-[10px] text-white/20 font-light tracking-[1em] uppercase">WiDo Creative</div>
        </div>
    </div>

    <div id="overlay">
        <div class="text-center p-12 bg-white/[0.03] backdrop-blur-3xl rounded-[60px] border border-white/10 mx-8 shadow-2xl">
            <h1 class="text-3xl font-thin tracking-[0.5em] mb-12 text-white leading-relaxed uppercase">Neural<br><span class="text-xs tracking-[1em] text-cyan-400">Content Engine</span></h1>
            <button id="startButton" class="px-16 py-6 bg-white text-black rounded-full active:scale-95 transition-all shadow-xl hover:bg-cyan-400 hover:text-white">
                <span class="font-bold tracking-[0.2em] text-sm">MULAI SCAN</span>
            </button>
            <p class="mt-10 text-[8px] text-white/30 tracking-[0.4em] uppercase italic leading-loose">Dioptimalkan untuk TikTok/Reels<br>Gunakan earphone untuk hasil maksimal</p>
        </div>
    </div>

    <script>
        let scene, camera, renderer, analyser, dataArray;
        let galaxyGroup; 
        let isInitialized = false, isPaused = false;
        let nodes = [], connections = [];
        let stars, clock = new THREE.Clock();
        let lastNodeTime = 0;
        
        // KONFIGURASI KHUSUS KONTEN SATISFYING
        const DETECTION_THRESHOLD = 32; 
        const BEAT_COOLDOWN = 150; 
        const MAX_NODES = 80; 
        const MAX_KHZ = 10.0; 
        const Y_RANGE = 2600; 

        async function initAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 1024;
                analyser.smoothingTimeConstant = 0.6; 
                source.connect(analyser);
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                isInitialized = true;
                document.getElementById('overlay').style.opacity = '0';
                setTimeout(() => document.getElementById('overlay').style.display = 'none', 1000);
            } catch (err) { alert("Mic ralat. Pastikan akses mikrofon diizinkan."); }
        }

        function createStarfield() {
            const starGeo = new THREE.BufferGeometry();
            const starVerts = [];
            for (let i = 0; i < 12000; i++) {
                starVerts.push((Math.random() - 0.5) * 15000, (Math.random() - 0.5) * 15000, (Math.random() - 0.5) * 15000);
            }
            starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starVerts, 3));
            stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 1.5, transparent: true, opacity: 0.4, sizeAttenuation: true }));
            scene.add(stars);
        }

        function initThree() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);
            scene.fog = new THREE.Fog(0x000000, 3000, 18000);
            
            galaxyGroup = new THREE.Group();
            scene.add(galaxyGroup);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 1, 80000);
            camera.position.set(0, 1200, 5000); 

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);
            
            createStarfield();
            
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            animate();
        }

        function getSatisfyingColor(khz) {
            if (khz < 2.0) return 0x4f46e5; 
            if (khz < 4.0) return 0x06b6d4; 
            if (khz < 6.0) return 0x10b981; 
            if (khz < 8.0) return 0xfacc15; 
            if (khz < 9.5) return 0xf97316; 
            return 0xf43f5e; 
        }

        function createCoordinateLabel(khz, x, y, color) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 400; canvas.height = 140;
            
            ctx.fillStyle = "rgba(0,0,0,0.7)";
            ctx.beginPath();
            ctx.roundRect(0, 0, 380, 120, 20);
            ctx.fill();

            ctx.fillStyle = color; 
            ctx.font = 'bold 42px "JetBrains Mono", monospace';
            ctx.fillText(`${khz.toFixed(1)}KHz`, 30, 55);
            
            ctx.font = '26px "JetBrains Mono", monospace';
            ctx.fillStyle = "#ffffff";
            ctx.globalAlpha = 0.6;
            ctx.fillText(`X:${Math.round(x)} Y:${Math.round(y)}`, 30, 100);
            
            const tex = new THREE.CanvasTexture(canvas);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, opacity: 0, depthTest: false }));
            sprite.scale.set(240, 84, 1);
            return sprite;
        }

        function createFlowConnection(startPos, endPos, color) {
            const midPoint = new THREE.Vector3().addVectors(startPos, endPos).multiplyScalar(0.5);
            const distance = startPos.distanceTo(endPos);
            midPoint.y += (Math.random() - 0.5) * distance * 0.7;
            midPoint.x += (Math.random() - 0.5) * distance * 0.5;

            const curve = new THREE.QuadraticBezierCurve3(startPos, midPoint, endPos);
            const points = curve.getPoints(35); 
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            geometry.setDrawRange(0, 0);

            const material = new THREE.LineBasicMaterial({ 
                color: color, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending 
            });

            const curveLine = new THREE.Line(geometry, material);
            curveLine.userData = { progress: 0, total: points.length, isFinished: false };
            galaxyGroup.add(curveLine);
            return curveLine;
        }

        function findSafePosition(yTarget, radius) {
            let attempts = 0;
            let foundPos = new THREE.Vector3();
            const minSafeDistance = radius * 5.0; 
            while (attempts < 60) {
                foundPos.set((Math.random() - 0.5) * 3500, yTarget, (Math.random() - 0.5) * 3500);
                let overlapping = false;
                for (let node of nodes) {
                    if (foundPos.distanceTo(node.position) < minSafeDistance) { overlapping = true; break; }
                }
                if (!overlapping) return foundPos;
                attempts++;
            }
            return foundPos; 
        }

        function createNode(freqIdx, intensity) {
            const khz = (freqIdx * (44100 / 2)) / 512 / 1000; 
            const color = new THREE.Color(getSatisfyingColor(khz));
            
            const freqScale = 1.6 + (khz * 0.4); 
            const baseSize = 25 + (intensity / 255 * 20) + (khz * 5.0);
            const atomSize = baseSize * freqScale * 0.5;

            const yPos = ((khz / MAX_KHZ) * Y_RANGE) - (Y_RANGE / 2.0); 
            const pos = findSafePosition(yPos, atomSize);

            const group = new THREE.Group();
            
            const mesh = new THREE.Mesh(
                new THREE.SphereGeometry(atomSize, 32, 32), 
                new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0 })
            );
            group.add(mesh);
            
            const glow = new THREE.Mesh(
                new THREE.SphereGeometry(atomSize * 1.8, 32, 32), 
                new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.15 })
            );
            group.add(glow);

            const label = createCoordinateLabel(khz, pos.x, pos.y, `#${color.getHexString()}`);
            label.position.set(atomSize + 120, atomSize + 40, 0);
            group.add(label);
            group.position.copy(pos);
            galaxyGroup.add(group);

            let connection = null;
            if (nodes.length > 0) {
                connection = createFlowConnection(nodes[nodes.length - 1].position, pos, color);
                connections.push(connection);
            } else {
                mesh.material.opacity = 0.9;
                label.material.opacity = 1.0;
            }

            nodes.push({ group, mesh, label, position: pos, time: Date.now(), size: atomSize, connection, isRevealed: (nodes.length === 0) });

            if (nodes.length > MAX_NODES) {
                const oldNode = nodes.shift();
                galaxyGroup.remove(oldNode.group);
                if(connections.length > 0) galaxyGroup.remove(connections.shift());
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            if (!isInitialized) return;
            const time = clock.getElapsedTime();

            if (!isPaused) {
                analyser.getByteFrequencyData(dataArray);
                let maxV = 0, maxI = 0, birdZoneEnergy = 0, totalEnergy = 0;
                
                for (let i = 0; i < dataArray.length; i++) { 
                    totalEnergy += dataArray[i];
                    if (i > 45) { 
                        birdZoneEnergy += dataArray[i];
                        if (dataArray[i] > maxV) { maxV = dataArray[i]; maxI = i; }
                    }
                }

                if (maxV > DETECTION_THRESHOLD && (birdZoneEnergy / (totalEnergy + 1) > 0.3)) {
                    const now = Date.now();
                    if (now - lastNodeTime > BEAT_COOLDOWN) { createNode(maxI, maxV); lastNodeTime = now; }
                }
                
                // ROTASI DIPERLAMBAT (DARI 0.004 KE 0.0012)
                if (galaxyGroup) galaxyGroup.rotation.y += 0.0012; 

                nodes.forEach((node) => {
                    if (node.connection && !node.connection.userData.isFinished) {
                        const conn = node.connection;
                        conn.userData.progress += 5.0; 
                        conn.geometry.setDrawRange(0, Math.floor(conn.userData.progress));
                        if (conn.userData.progress >= conn.userData.total) {
                            conn.userData.isFinished = true;
                            node.isRevealed = true;
                            node.revealTime = Date.now();
                        }
                    } else if (!node.connection) { node.isRevealed = true; }

                    if (node.isRevealed) {
                        const revealAge = Date.now() - (node.revealTime || node.time);
                        if (revealAge < 700) {
                            const explosion = 1.0 + Math.pow(1.0 - (revealAge / 700), 3) * 4.0;
                            node.group.scale.setScalar(explosion);
                            node.mesh.material.opacity = 0.9;
                            node.label.material.opacity = 1.0;
                        } else {
                            node.group.scale.setScalar(1.0 + Math.sin(time * 3.5 + nodes.indexOf(node)) * 0.03);
                        }
                    }
                    node.label.quaternion.copy(camera.quaternion);
                });

                document.getElementById('node-count').innerText = `Atoms: ${nodes.length} | Ready for Record`;
            }

            if (stars) {
                stars.rotation.y += 0.00005;
                // ORBIT KAMERA DIPERLAMBAT (DARI 0.05 KE 0.015)
                camera.position.x = Math.sin(time * 0.015) * 800; 
                camera.lookAt(0, 0, 0);
            }
            renderer.render(scene, camera);
        }

        document.getElementById('startButton').addEventListener('click', initAudio);
        document.getElementById('resetBtn').addEventListener('click', () => {
            nodes.forEach(n => galaxyGroup.remove(n.group));
            connections.forEach(l => galaxyGroup.remove(l));
            nodes = []; connections = [];
        });
        document.getElementById('playPauseBtn').addEventListener('click', () => {
            isPaused = !isPaused;
            document.getElementById('playPauseBtn').innerText = isPaused ? "PLAY" : "PAUSE";
            document.getElementById('playPauseBtn').classList.toggle('active-state', !isPaused);
        });
        document.getElementById('fullScreenBtn').addEventListener('click', () => {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        });

        initThree();
    </script>
</body>
</html>
